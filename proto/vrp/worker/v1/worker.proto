syntax = "proto3";

package vrp.worker.v1;
import "vrp/maps/v1/maps.proto";

import "vrp/engine/v1/engine.proto";

// Local supervisor/child IPC. Each protobuf message is prefixed by a four-byte
// little-endian payload length. stdout is reserved for ChildEvent frames.
message ChildStart {
  vrp.engine.v1.SolveRequest request = 1;
  uint32 progress_interval_ms = 2;
}
message ChildCommand {
  oneof command {
    ChildStart start = 1;
    bool cancel = 2;
  }
}
enum ChildPhase {
  CHILD_PHASE_COMPILING = 0;
  CHILD_PHASE_SEARCHING = 1;
  CHILD_PHASE_EXPLAINING = 2;
}
message ChildProgress {
  ChildPhase phase = 1;
  vrp.engine.v1.Progress search = 2;
  uint32 process_id = 3;
}
message ChildFailure {
  string code = 1;
  string message = 2;
}
message ChildEvent {
  oneof event {
    ChildProgress progress = 1;
    vrp.engine.v1.SolveResult result = 2;
    ChildFailure failure = 3;
  }
}

// Generic local task isolation. Inner payload/result bytes are protobuf values
// defined by the selected trusted executable command (GeoRunRequest/Response for
// geo-child); they are never serialized SolveResult substitutes.
message ProcessStart {
  bytes payload = 1;
  uint32 progress_interval_ms = 2;
}
message ProcessCommand {
  oneof command {
    ProcessStart start = 1;
    bool cancel = 2;
  }
}
message ProcessProgress {
  string phase = 1;
  uint64 completed = 2;
  uint64 total = 3;
  uint32 process_id = 4;
}
message ProcessEvent {
  oneof event {
    ProcessProgress progress = 1;
    bytes result = 2;
    ChildFailure failure = 3;
  }
}

enum GeoTaskKind {
  GEO_TASK_KIND_BUILD_MATRIX = 0;
  GEO_TASK_KIND_BUILD_GEOMETRY = 1;
  // Validate an entire downloaded PBF in the same memory-limited child.
  // Input/result may be absent; pbf_paths identifies the staged package.
  GEO_TASK_KIND_VALIDATE_PACKAGE = 2;
}
// Trusted local manifest. Paths are generated by the application, never taken
// directly from an external HTTP caller. Artifacts use their native protobuf
// contract; the parent checks size/hash before publishing them atomically.
message GeoRunRequest {
  GeoTaskKind kind = 1;
  vrp.engine.v1.SolveRequest input = 2;
  vrp.engine.v1.SolveResult result = 3;
  repeated string pbf_paths = 4;
  string network_path = 5;
  string output_path = 6;
  double connector_speed_kph = 7;
  double buffer_km = 8;
  uint32 threads = 9;
  string job_id = 10;
  // Trusted, previously verified cache candidate; the child validates its
  // input/package/config identity before reuse. network_path remains output.
  string cached_network_path = 11;
  // Package coverage for each input location. Empty means all covered for
  // internal callers; otherwise length must equal input.problem.locations.
  // A MODEL pair requires both endpoints covered; other pairs use FALLBACK.
  repeated bool location_covered = 12;
}
message GeoRunResponse {
  string output_path = 1;
  string network_path = 2;
  uint64 output_size = 3;
  bytes output_sha256 = 4;
  uint64 model_edges = 5;
  uint64 fallback_edges = 6;
  repeated string warnings = 7;
  // Actual geographic extraction buffer after any bounded boundary retry.
  double effective_buffer_km = 8;
}

// Trusted metadata-only IPC; generated paths remain under the task directory.
message BasemapRunRequest {
  vrp.maps.v1.BasemapTaskInput input = 1;
  string output_path = 2;
}
message BasemapRunResponse { vrp.maps.v1.BasemapPackage package = 1; string output_path = 2; vrp.maps.v1.BasemapEstimate estimate = 3; }
