<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060"
  viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">vrp-1 technical architecture and compute boundary</title>
  <desc id="desc">The workbench and business systems access vrp-server over HTTP. The application handles storage, scheduling, geography, and basemaps. vrp-worker runs isolated solves over Protobuf IPC; the CLI can also call vrp-model directly. vrp-model validates and compiles input for the standard-library-only vrp-core. Files in proto are the only contract source.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#d7e4e9"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#055668" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#bd5d13" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
    .mono { font-family: Consolas, 'DejaVu Sans Mono', monospace; }
  </style>
  <rect width="1440" height="1060" rx="20" fill="#f3f8fa"/>
  <rect width="1440" height="1060" rx="20" fill="url(#grid)"/>

<rect x="40" y="38" width="6" height="28" rx="3" fill="#0bbbe7" stroke="none"/>
<text x="60" y="59" font-size="20" fill="#055668" font-weight="700" text-anchor="start">vrp-1</text>
<text x="1400" y="58" font-size="16" fill="#56727e" font-weight="600" text-anchor="end">TECHNICAL ARCHITECTURE  /  02</text>
<text x="40" y="113" font-size="36" fill="#153c4a" font-weight="700" text-anchor="start">A pure core. A complete application around it.</text>
<text x="40" y="148" font-size="19" fill="#56727e" font-weight="400" text-anchor="start">Main calls and data flow. Networking, files, persistence, and process management live outside the core.</text>
<rect x="40" y="182" width="1360" height="72" rx="10" fill="#e5f3f8" stroke="#bbdbe6"/>
<text x="64" y="212" font-size="13" fill="#055668" font-weight="700" text-anchor="start">SINGLE CONTRACT SOURCE</text>
<text x="64" y="239" font-size="21" fill="#055668" font-weight="600" text-anchor="start" class="mono">proto/**/*.proto</text>
