<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060"
  viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">vrp-1 技术架构与计算边界</title>
  <desc id="desc">工作台与业务系统通过 HTTP 访问 vrp-server。应用层负责持久化、调度、路网和离线底图。vrp-worker 通过 Protobuf IPC 运行隔离求解；CLI 也可直接调用 vrp-model。模型层完成校验和编译后进入仅依赖标准库的 vrp-core。契约唯一来源为 proto 下的文件。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#d7e4e9"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#055668" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#bd5d13" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
    .mono { font-family: Consolas, 'DejaVu Sans Mono', monospace; }
  </style>
  <rect width="1440" height="1060" rx="20" fill="#f3f8fa"/>
  <rect width="1440" height="1060" rx="20" fill="url(#grid)"/>

