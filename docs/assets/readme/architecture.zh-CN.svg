<text x="466" y="239" font-size="16" fill="#56727e" font-weight="400" text-anchor="start">Prost 类型 + ProtoJSON，由 .proto 生成</text>
<text x="1376" y="213" font-size="16" fill="#055668" font-weight="500" text-anchor="end" class="mono">engine  /  worker  /  app  /  maps</text>
<text x="1376" y="239" font-size="16" fill="#56727e" font-weight="400" text-anchor="end">HTTP · IPC · 冻结请求 / 结果</text>
<text x="40" y="298" font-size="16" fill="#56727e" font-weight="600" text-anchor="start">01 / 接入入口</text>
<text x="1080" y="298" font-size="16" fill="#56727e" font-weight="600" text-anchor="start">03 / 应用资源</text>
