<text x="1400" y="58" font-size="16" fill="#56727e" font-weight="600" text-anchor="end">技术架构  /  RUNTIME &amp; DATA FLOW</text>
<text x="40" y="113" font-size="36" fill="#153c4a" font-weight="700" text-anchor="start">纯计算内核，完整的应用外层</text>
<text x="40" y="148" font-size="19" fill="#56727e" font-weight="400" text-anchor="start">主要调用与数据流；应用层承担网络、文件、持久化与进程管理。</text>
<rect x="40" y="182" width="1360" height="72" rx="10" fill="#e5f3f8" stroke="#bbdbe6"/>
<text x="64" y="212" font-size="13" fill="#055668" font-weight="700" text-anchor="start">唯一契约源</text>
<text x="64" y="239" font-size="21" fill="#055668" font-weight="600" text-anchor="start" class="mono">proto/**/*.proto</text>
