[package]
name = "vrp-server"
description = "Standalone task API and durable local scheduler"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
vrp-core.workspace = true
vrp-model.workspace = true
vrp-worker.workspace = true
vrp-proto.workspace = true
vrp-geo.workspace = true
vrp-basemap.workspace = true
prost.workspace = true
serde = "1"
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util"] }
rusqlite = { version = "0.41", features = ["bundled"] }
async-stream = "0.3"
futures-util = "0.3"
sha2 = "0.10"
constant_time_eq = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
