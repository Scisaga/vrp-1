[package]
name = "vrp-basemap"
description = "Bounded offline PMTiles extraction and validation"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
vrp-proto.workspace = true
pmtiles = { version = "0.28", default-features = false, features = ["write", "iter"] }
bytes = "1"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde_json.workspace = true
sha2 = "0.10"
